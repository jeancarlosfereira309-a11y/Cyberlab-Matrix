
name: Build CyberLab Matrix APK

on:
  workflow_dispatch:
  push:
    branches: [principal]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --user --upgrade buildozer cython
          echo "$(python -m site --user-base)/bin" >> "$GITHUB_PATH"
          "$(python -m site --user-base)/bin/buildozer" --version

      - name: Build APK
        run: |
          buildozer android clean
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberLab-Matrix-APK
          path: bin/*.apk
          if-no-files-found: error
          
