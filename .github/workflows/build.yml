
name: Criar APK do CyberLab Matrix

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git zip unzip \
            autoconf automake libtool \
            pkg-config cmake ccache \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev \
            libltdl-dev

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest"

      - name: Verificar Java e Android SDK
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed
          find "$ANDROID_HOME/build-tools" \
            -name aidl -type f

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.34"
          python -m pip install buildozer

      - name: Criar APK
        run: buildozer -v android debug

      - name: Enviar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CyberLab-Matrix-APK
          path: bin/*.apk
          if-no-files-found: error
          
