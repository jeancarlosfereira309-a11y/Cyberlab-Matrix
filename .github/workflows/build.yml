
name: Criar APK do CyberLab Matrix

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git zip unzip \
            autoconf automake libtool \
            pkg-config cmake ccache \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev \
            libltdl-dev

      - name: Configurar Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O /tmp/android-tools.zip
          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          mv /tmp/android-tools/cmdline-tools/* "$HOME/android-sdk/cmdline-tools/latest/"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      
      - name: Aceitar licencas Android
        run: |
          yes | sdkmanager --licenses 

      
      
      - name: Instalar ferramentas Android
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado"
            exit 1
          fi

          mkdir -p "$SDK"
          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDK=$SDK"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses

          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "=== AIDL instalado ==="
          find "$SDK/build-tools" -type f -name aidl

          if ! find "$SDK/build-tools" -type f -name aidl | grep -q .; then
            echo "ERRO: AIDL não foi encontrado"
            exit 1
          fi
          


      - name: Verificar AIDL
        run: |
          find "$ANDROID_HOME/build-tools" -type f -name aidl

      
      - name: Localizar e configurar AIDL
        run: |
          echo "Procurando AIDL..."
          find "$ANDROID_HOME/build-tools" -type f -name aidl

          AIDL_PATH=$(find "$ANDROID_HOME/build-tools" \
            -type f -name aidl | sort -V | tail -n 1)

          if [ -z "$AIDL_PATH" ]; then
            echo "AIDL não encontrado. Instalando Build Tools..."
            sdkmanager --install "build-tools;35.0.0"
            AIDL_PATH=$(find "$ANDROID_HOME/build-tools" \
              -type f -name aidl | sort -V | tail -n 1)
          fi

          if [ -z "$AIDL_PATH" ]; then
            echo "ERRO: AIDL não foi instalado."
            exit 1
          fi

          echo "AIDL encontrado: $AIDL_PATH"
          echo "$(dirname "$AIDL_PATH")" >> "$GITHUB_PATH"
          
      
      - name: Verificar Android SDK
        run: |
          java -version
          sdkmanager --list_installed
          find "$ANDROID_HOME/build-tools" -name aidl -type f
        

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.34"
          python -m pip install buildozer

      
      
      - name: Diagnosticar SDK e AIDL
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "=== SDK do ambiente ==="
          find "$ANDROID_HOME" -type f -name aidl 2>/dev/null || true

          echo "=== SDK do Buildozer ==="
          find "$HOME/.buildozer/android" -type f -name aidl 2>/dev/null || true

          echo "=== Licenças do SDK ==="
          ls -la "$ANDROID_HOME/licenses" 2>/dev/null || true
          

      - name: Preparar caminho do sdkmanager para Buildozer
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$(find "$SDK" "$ANDROID_HOME" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado"
            exit 1
          fi

          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          echo "sdkmanager encontrado em: $SDKMANAGER"
          "$SDK/tools/bin/sdkmanager" --version
          - name: Configurar SDK para Buildozer
  run: |
    SDK_TARGET="$HOME/.buildozer/android/platform/android-sdk"
    SDK_SOURCE="$HOME/android-sdk"
    
    # Create parent directory
    mkdir -p "$(dirname "$SDK_TARGET")"
    
    # Remove if exists and create symlink
    rm -rf "$SDK_TARGET"
    ln -s "$SDK_SOURCE" "$SDK_TARGET"
    
    # Verify the structure
    ls -la "$SDK_TARGET/cmdline-tools/latest/bin/sdkmanager"
    ls -la "$SDK_TARGET/build-tools/"
    ls -la "$SDK_TARGET/platforms/"
      
      - name: Criar APK
  env:
    ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
    ANDROID_NDK_VERSION: "28c"
  run: buildozer -v android debug

      - name: Enviar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CyberLab-Matrix-APK
          path: bin/*.apk
          if-no-files-found: error
          
